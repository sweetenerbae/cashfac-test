services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      HTTP_PORT: 8080
      GUARDIAN_API_KEY: ${GUARDIAN_API_KEY}
    expose:
      - "8080"
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
